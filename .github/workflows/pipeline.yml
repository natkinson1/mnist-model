name: "Run Tests and Deploy Model Endpoint"

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:
  
env:
  AWS_REGION: "ap-southeast-2"

permissions:
  id-token: write
  contents: read

jobs:
  # run-tests:
  #   runs-on: ubuntu-latest
  #   steps:
  #   - uses: actions/checkout@v5
  #   - name: Setup python
  #     uses: actions/setup-python@v5
  #     with:
  #       python-version: '3.13.5'
  #   - name: Install Dependencies
  #     run: |
  #       python -m pip install --upgrade pip
  #       pip install -r requirements.txt
  #   - name: Run tests with pytest
  #     run: |
  #       pytest
  deploy-s3-infra:
    runs-on: ubuntu-latest
    outputs:
      s3_model_artifact_dir: ${{ steps.tf_s3_output.outputs.s3_model_artifact_dir}}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5.1.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.13.4'
    - name: Run Terraform Init for S3
      run: terraform -chdir=terraform/s3 init
    - name: Run Terraform apply
      run: terraform -chdir=terraform/s3 apply -auto-approve
    - name: Get Terraform output
      id: tf_s3_output
      run: |
        S3_MODEL_ARTIFACT_DIR=$(terraform -chdir=terraform/s3 output -raw mnist-bucket-name)
        echo "s3_model_artifact_dir=s3://$S3_MODEL_ARTIFACT_DIR/model-artifacts" >> $GITHUB_OUTPUT
    - name: Push model artifact to s3
      run: aws s3 cp model.tar.gz ${{ steps.tf_s3_output.outputs.s3_model_artifact_dir }}/model.tar.gz
  deploy-ecr-model-container:
    runs-on: ubuntu-latest
    needs: ["deploy-s3-infra"]
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5.1.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.13.4'
    - name: Run Terraform Init for ECR
      run: terraform -chdir=terraform/ecr init
    - name: Run Terraform apply
      run: terraform -chdir=terraform/ecr apply -auto-approve
    - name: Get Terraform output
      id: tf_output
      run: |
        ECR_REPOSITORY=$(terraform -chdir=terraform/ecr output -raw mnist-repo-name)
        echo "ECR_REPOSITORY=$ECR_REPOSITORY" >> $GITHUB_OUTPUT
    - name: Print ECR repo name
      run: echo "ECR name = ${{ steps.tf_output.outputs.ECR_REPOSITORY }}"
    - name: Login to AWS ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag and push to AWS ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ steps.tf_output.outputs.ECR_REPOSITORY }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
  deploy-sagemaker-model:
    runs-on: ubuntu-latest
    needs: ["deploy-ecr-model-container", "deploy-s3-infra"]
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5.1.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.13.4'
    - name: Output Image Tag
      run: echo "${{ needs.deploy-ecr-model-container.outputs.image }}"
    - name: Output s3 model artifact dir
      run: echo "${{ needs.deploy-s3-infra.outputs.s3_model_artifact_dir }}"
    - name: Run Terraform Init
      run: terraform -chdir=terraform/sagemaker init
    - name: Run Terraform apply
      run: |
        terraform -chdir=terraform/sagemaker apply \
        -auto-approve \
        -var="image_uri=${{ needs.deploy-ecr-model-container.outputs.image }}" \
        -var="model_data_url=${{ needs.deploy-s3-infra.outputs.s3_model_artifact_dir }}model.tar.gz"

